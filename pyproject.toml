[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jialugao-research-site"
version = "0.1.0"
description = "Static catalog for selected research projects and reports"
requires-python = ">=3.10"
dependencies = [
  "Jinja2>=3.1,<4",
  "latex2mathml>=3.81,<4",
  "markdown-it-py>=3,<5",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["beautifulsoup4>=4.12,<5", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["research_site*"]
