<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jialu Gao 的研究项目、关键指标与静态研究报告">
  <title>{% block title %}Jialu Gao Research{% endblock %}</title>
  <link rel="stylesheet" href="{{ base_url }}assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ base_url }}">
      <span class="brand-mark">JG</span>
      <span>Research</span>
    </a>
    <nav aria-label="主导航">
      <a href="{{ base_url }}">项目</a>
      <a href="{{ base_url }}reports/">报告</a>
      <a href="https://github.com/jialugao19">GitHub</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>静态研究审阅站 · 仅在明确更新项目时刷新</p>
  </footer>
  <script src="{{ base_url }}assets/site.js" defer></script>
</body>
</html>
