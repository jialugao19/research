name: Validate and deploy research site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python scripts/validate_catalog.py
      - name: Test report audit
        run: python -m pytest tests/test_audit.py
      - name: Test site build
        run: python -m pytest tests/test_build.py
      - name: Test catalog
        run: python -m pytest tests/test_catalog.py
      - name: Test knowledge math audit
        run: python -m pytest tests/test_math_audit.py
      - name: Test publication safety
        run: python -m pytest tests/test_publication.py
      - name: Test Markdown reports
        run: python -m pytest tests/test_report_content.py
      - run: python scripts/build_site.py --base-url /research/
      - run: python scripts/validate_site.py --base-url /research/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
