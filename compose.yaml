name: research-site

services:
  web:
    image: nginx:stable-alpine
    container_name: research-site
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    ports:
      - "0.0.0.0:8088:80"
    volumes:
      - type: bind
        source: .
        target: /srv/research-site
        read_only: true
      - type: bind
        source: ./deploy/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
