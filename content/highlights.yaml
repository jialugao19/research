schema_version: 1

metrics:
  - id: best-reported-test-ic
    label: Best reported test IC
    category: quality
    experiment: index500-clean-benchmark
    metric: etf-test-ic
    scope: ETF forecast · 2024-02–2025-12 · pre-cost
  - id: multi-seed-test-ic
    label: Multi-seed test IC
    category: quality
    experiment: optimize-1min-model
    metric: test-pooled-ic
    scope: GRU192×2 · seeds 7/11/13
  - id: featured-net-sharpe
    label: Featured net Sharpe
    category: quality
    experiment: baseline-1s-0720
    metric: net-sharpe
    scope: 10m net · test-selected · not promoted
  - id: architectures-screened
    label: Architectures screened
    category: method
    experiment: optimize-1min-model
    metric: architecture-candidates
    scope: fixed-budget 1min screen
  - id: order-book-ticks
    label: Order-book ticks
    category: scale
    experiment: aq2-v16
    metric: snapshot-ticks
    display_format: compact-1
    scope: AQ2 v16 full rerun
  - id: evaluation-rows
    label: 1s evaluation rows
    category: scale
    experiment: baseline-1s-0720
    metric: evaluation-rows
    display_format: compact-2
    scope: Stock1s fold0 test
  - id: evidence-windows
    label: Evidence windows
    category: coverage
    display_value: 2021–2026
    scope: non-continuous across experiments
  - id: research-universe
    label: Research universe
    category: coverage
    display_value: A-share / ETF / Crypto
    scope: public catalog coverage

featured:
  report: 0807-stock1s-fold0-full-evaluation
  experiment: baseline-1s-0720
  decision_label: Keep in research
  decision_summary: Strong fold0 signal evidence does not pass the current selection and trading gates.
  gates:
    - id: signal
      label: Signal
      state: positive
      value: Fold0 validated
    - id: selection
      label: Selection
      state: warning
      value: Requires clean rerun
    - id: trading
      label: Trading
      state: negative
      value: Not promoted
  chart:
    title: Realized return by prediction quantile
    description: Mean realized return in the six edge prediction bins published for three important A-share index pools. Middle bins Q04–Q17 are intentionally omitted.
    source_note: Published report section 3.3 · mean_real_return × 10,000 · bps
    bins: [1, 2, 3, 18, 19, 20]
    series:
      - id: csi1000
        label: CSI 1000
        values: [-8.054, -3.855, -2.834, 3.612, 4.521, 7.072]
      - id: csi300
        label: CSI 300
        values: [-5.046, -2.894, -2.263, 2.685, 3.333, 5.065]
      - id: csi500
        label: CSI 500
        values: [-5.914, -3.623, -2.865, 2.955, 3.903, 6.273]

rejected_ideas:
  - title: Attention representation
    state: Not promoted
    experiment: optimize-1min-model
    metric_ids: [test-pooled-ic, attention-test-ic]
    reason: Three-seed test IC reached 0.07066 versus 0.07895 for the retained GRU192×2 last-hidden model.
  - title: TCN architecture
    state: Not promoted
    experiment: optimize-1min-model
    metric_ids: []
    reason: The fixed-budget architecture screen did not produce evidence strong enough to displace the compact GRU baseline.
  - title: Large GRU / MLP capacity
    state: Not promoted
    experiment: optimize-1min-model
    metric_ids: [baseline-parameters, parameters]
    reason: Roughly 1.81M parameters did not improve out-of-sample stability; the retained model uses 342,337 parameters.
