path:
  name: Deep Learning Engineer
  summary: 从可微计算与 PyTorch 工作流出发，依次学习训练、架构、生成模型和系统效率。
  organization: part -> stage -> concept -> article
  inspiration: Datawhale Deep Learning Notes 的 Part / Chapter / tutorial 三级结构
