    label: Order-book data foundation
    summary: Microstructure concepts connect directly to L2 snapshot quality and market-data coverage.
  - domain: quantitative-research
    topic: market-microstructure
    project: live-predictor
    label: Live signal evaluation
    summary: Spread, queue, impact, and execution constraints define live prediction interpretation.
  - domain: quantitative-research
    topic: time-series
    project: prediction-nn
    label: Short-horizon return forecasting
    summary: Time-series leakage, regime, and window design constrain model evaluation.
  - domain: quantitative-research
    topic: factor-research
    project: webpage5
    label: Factor research platform
    summary: Factor construction and IC evaluation link knowledge nodes to the research system.
