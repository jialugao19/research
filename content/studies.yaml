  - id: val-select
    project: prediction-nn
    track: one-minute
    subproject: validation
    title: 稳健 Checkpoint 选择规则
    status: completed
    maturity: decision-ready
    updated_at: 2026-06-29
    objective: 如果直接选择单个 validation 窗口上 IC 最高的 checkpoint，结果容易追随短期噪声，并在反复查看 test 后形成隐性过拟合。本实验把 checkpoint 选择改为多时期规则：同时考察三个 rolling/purged validation fold 和最后 20 个交易日，用 IC 均值减去 0.5 倍标准差衡量表现与稳定性，再从前两名中选择更早的 checkpoint。
    summary: 新规则在不读取 test 排名的情况下选择 20k checkpoint，并把 30k 保留为更激进的对照。一次性 test 审计中，20k 相对事后最优 checkpoint 的 regret 为 0，说明保守选择没有损失本次测试表现；这一结果支持固定 selector，但同一 test 不应继续用于迭代规则。
    decision: 使用 20k robust default；30k 只保留为 aggressive comparison。
    caveats:
      - 同一 test audit 不应被反复用于继续调 selector。
    metrics:
      - id: selected-checkpoint
        label: Robust checkpoint
        value: 20000
        format: integer
        context: earliest top-2
      - id: mean-test-ic
        label: Mean test IC
        value: 0.059220
        format: decimal
        decimals: 5
        context: robust 20k winner
      - id: top-decile-return
        label: Mean top-decile return
        value: 5.235391
        format: bps
        decimals: 2
        context: robust 20k winner
    report_ids: []
    evidence_ref: exp-nn/0-select&report/experiments/val-select/results.yaml
    featured: true

