  - id: optimize-1min-model
    project: prediction-nn
    track: one-minute
    subproject: optimize-1min-model
    title: 1min Model Structure Final Evaluation
    status: completed
    maturity: decision-ready
    updated_at: 2026-07-25
    objective: 在多 seed 最终评估中比较 last-hidden 与 attention，并控制模型容量。
    summary: GRU192×2 last-hidden 在三个 seed 的 test pooled IC 和 Rank IC 上全部胜出，且参数量约为旧大模型的五分之一。
    decision: 保留 GRU192×2 MLP[] last-hidden；不晋升 attention 或 TCN。
    caveats:
      - 该结论是结构与信号选择，不是成本后交易证明。
    metrics:
      - id: test-pooled-ic
        label: Test pooled IC mean
        value: 0.0789459452
        format: decimal
        decimals: 5
        context: seeds 7/11/13
      - id: test-rank-ic
        label: Test Rank IC mean
        value: 0.0465149687
        format: decimal
        decimals: 5
        context: seeds 7/11/13
      - id: attention-test-ic
        label: Attention test IC
        value: 0.0706621299
        format: decimal
        decimals: 5
        context: 三 seed 对照
      - id: parameters
        label: Trainable parameters
        value: 342337
        format: integer
        context: retained last-hidden model
