schema_version: 2
studies:
- id: strategy-execution
  project_ids:
  - route
  - limit-0729
  - shouban2
  title: 交易规则与执行证据
  question: 预测或交易规则在明确执行、成本和资金路径下支持什么结论?
  taxonomy_path: strategy/execution
  experiment_ids:
  - us-route-top3-backtest-20261022
  - limit-t1-strategy
  - shouban-report-gate
  report_ids: []
  conclusion: Route 当前是带 selection bias 和持仓漂移限制的 Gross 回测; T+1 策略与首板报告属于不同合同. 这些证据不支持跨策略排名或统一实盘结论.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: strategy-top1-membership-cost
  project_ids:
  - prediction-nn-1min
  title: 分钟 Top 1% 成本与可执行性
  question: 固定 baseline 预测的动态 Top 1% 持仓对 A 股成本、滑点和停牌有多敏感?
  taxonomy_path: strategy/execution
  experiment_ids:
  - top1-membership-cost-20261101
  report_ids:
  - 1101-top1-membership-cost
  conclusion: 万一免五假设下, 0 bps 滑点期末 NAV 为 5.82, 5 bps 为 0.78; 无成交持仓按末次成交价估值. 结果是成本敏感性诊断, 尚不构成可执行策略证据.
  caveats:
  - 未模拟 T+1、整手、涨跌停或按 Close 实际成交的可行性.
  - 期末 11 只无成交持仓在 0 bps 情景占 NAV 3.55%, 估值未验证可回收性.
- id: model-baseline
  project_ids:
  - prediction-nn-1min
  title: 预测模型与基线
  question: 在明确的数据和选模合同内, 哪些模型能够提供可复验的预测信号?
  taxonomy_path: model/baseline
  experiment_ids:
  - reference-baseline
  - reference-baseline-v2
  - optimize-1min-model
  - baseline-main-20260622
  - baseline-1min-0813
  report_ids: []
  conclusion: 小 GRU 的结构候选与 paired VWAP 标签基线具有各自合同内的正向证据. 历史 close 基线仅作参考; 工程合同验证不能替代正式 OOS 实验.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: model-loss-function
  project_ids:
  - prediction-nn-1min
  title: 训练目标与泛化
  question: 改变训练目标是否改善同口径的样本外预测?
  taxonomy_path: model/loss-function
  experiment_ids:
  - loss-function-1min
  report_ids: []
  conclusion: Promote only to a multi-seed Stage C candidate, not to the default loss.
  caveats:
  - This is a seed7 screen; prediction volatility remains materially below target volatility for every variant.
- id: prediction-evaluation-model-comparison
  project_ids:
  - prediction-nn-1s
  title: 秒级信号与执行边界
  question: 秒级模型的条件信号能否通过稳健性、PIT 和执行验证?
  taxonomy_path: prediction-evaluation/model-comparison
  experiment_ids:
  - baseline-1s-0720
  - baseline-1s-v2
  report_ids: []
  conclusion: 秒级模型存在条件信号证据, 但 PIT、选择偏差与执行成本仍限制使用; 不据此与分钟模型直接排名或提升为交易策略.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: data-engineering-universe-filters
  project_ids:
  - prediction-nn-1min
  title: 样本过滤与评估总体
  question: 样本过滤是否改善信号, 差异是否来自 test universe 改变?
  taxonomy_path: data-engineering/universe/filters
  experiment_ids:
  - test-all
  - limit-pool
  report_ids: []
  conclusion: limit-pool 内 touch 的信号略优于 all, 更严格的 limit 未同步改善. train-filter/full-test 诊断改变了 test universe, 不能与过滤
    test 的主矩阵直接比较.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: data-engineering-data-clean-outlier
  project_ids:
  - prediction-nn-1min
  title: 异常与近零样本
  question: 近零样本处理是否改善预测, 并保持样本口径可解释?
  taxonomy_path: data-engineering/data-clean/outlier
  experiment_ids:
  - near-zero-filter
  report_ids: []
  conclusion: Retain separate IC/return and hit-rate objectives rather than declaring one global winner.
  caveats:
  - Trading and cost metrics remain proxies and are not equivalent to live returns.
- id: model-optimization
  project_ids:
  - prediction-nn-1min
  title: 训练预算与优化
  question: 学习率、容量和采样变化是否带来稳健增益?
  taxonomy_path: model/optimization
  experiment_ids:
  - learning-rate
  - capacity-robust-sampling
  report_ids: []
  conclusion: 现有记录支持优先研究小模型与 early stopping; warmup-cosine 学习率建议只适用于原模型、batch、数据和预算合同.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: data-engineering-data-clean-validation-split
  project_ids:
  - prediction-nn-1min
  title: 时间切分与泄漏
  question: 验证切分是否保持时间因果性并支持稳健选择?
  taxonomy_path: data-engineering/data-clean/validation-split
  experiment_ids:
  - rolling-purged-val
  report_ids: []
  conclusion: Do not replace the architecture solely for temporal decay; trading decisions still require portfolio-level
    validation.
  caveats:
  - Test is retained only as a pipeline contract, not as selection or trading evidence.
- id: prediction-evaluation-robustness-checkpoint
  project_ids:
  - prediction-nn-1min
  title: Checkpoint 选择稳定性
  question: 仅使用 validation 的 checkpoint 选择能否稳定推广到 test?
  taxonomy_path: prediction-evaluation/robustness/checkpoint
  experiment_ids:
  - val-select
  - generalization-block70-checkpoint-curve
  report_ids: []
  conclusion: 原 val-select 合同保留 20k 作为 robust 默认, 30k 仅作 aggressive 比较. Block70 曲线用于诊断过训练, 不用于选择生产 checkpoint.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: data-engineering-label
  project_ids:
  - prediction-nn-1min
  title: 预测目标与持有区间
  question: 标签端点和 horizon 如何影响同口径预测质量?
  taxonomy_path: data-engineering/label
  experiment_ids:
  - prediction-calibration
  - horizon-labels
  report_ids: []
  conclusion: A2 VWAP 方向值得多 seed 验证, A3 robust-label 未通过提升门槛. 独立 horizon 合同中 h15 的 pooled IC 较高, h30 的 RankIC 与
    spread 较高; 不跨标签合同排名.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: prediction-evaluation-robustness-monthly
  project_ids:
  - prediction-nn-1min
  title: 跨时间泛化
  question: 预测质量在不同年份和时间窗口中是否稳定?
  taxonomy_path: prediction-evaluation/robustness/monthly
  experiment_ids:
  - generalization-rolling-stride
  report_ids: []
  conclusion: Retain stride5 as a development candidate; treat the stride10 10k recovery as post-hoc diagnosis only.
  caveats:
  - Variants use different test years and only seed7, so no unified conclusion versus baseline is valid.
- id: prediction-evaluation-robustness
  project_ids:
  - prediction-nn-1min
  title: 采样与多 seed 稳健性
  question: 采样差异是否能在多 seed 和一致评估合同下复现?
  taxonomy_path: prediction-evaluation/robustness
  experiment_ids:
  - generalization-adjacent-window
  - generalization-adjacent-window-multiseed
  report_ids: []
  conclusion: Block70 的开发观察未通过当前多 seed 协议, 不替换 Dense. 后续比较需要保留预算和 exposure 的匹配边界.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: model-integration
  project_ids:
  - prediction-nn-1min
  title: 候选组合能否叠加
  question: 独立实验中的局部增益是否能在同合同组合中稳定叠加?
  taxonomy_path: model/integration
  experiment_ids:
  - main-combo-integration
  - combo-touch-nz-lr
  report_ids: []
  conclusion: 局部候选增益未稳定叠加, 保留 main-combo 的负面结果. 旧 combo 已被替代, 历史 run root 缺失使进一步 artifact 比较需要重跑.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: data-engineering-data-clean-normalization
  project_ids:
  - prediction-nn-1min
  title: 归一化与零值语义
  question: 归一化如何影响零值特征和样本外信号?
  taxonomy_path: data-engineering/data-clean/normalization
  experiment_ids:
  - zero-aware-normalization
  report_ids: []
  conclusion: Make no improvement claim until the off control and model-card consistency are restored.
  caveats:
  - F24 model-card metadata does not match the prepared data.
- id: feature-engineering-order-book-l2
  project_ids:
  - prediction-nn-1min
  title: 订单簿增量信息
  question: L2 特征是否提供独立于基线的预测增量?
  taxonomy_path: feature-engineering/order-book-l2
  experiment_ids:
  - l2-features
  report_ids: []
  conclusion: Preserve the observation but block cross-arm attribution claims.
  caveats:
  - Feature content is confounded with checkpoint training depth; a uniform-policy rerun is required.
- id: data-engineering-data-clean
  project_ids:
  - prediction-nn-1min
  - aq2
  title: 数据清洗与输入正确性
  question: 数据处理和重建是否具备可验证的正确性证据?
  taxonomy_path: data-engineering/data-clean
  experiment_ids:
  - feature-cleaning-bundle-0609
  - aq2-v16
  report_ids: []
  conclusion: AQ2 v16 具备规则回归证据, 特征清洗历史档案只支持审计. 两者解决不同输入问题, 不混合解释为模型质量提升.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: prediction-evaluation-summary-ic
  project_ids:
  - index500-predict
  - live-predictor
  - prediction-nn-1min
  title: 信号质量与使用边界
  question: 现有预测指标支持哪些结论, 还缺哪些执行证据?
  taxonomy_path: prediction-evaluation/summary/ic
  experiment_ids:
  - index500-clean-benchmark
  - live-predictor-live-quality
  - 0827-market-cs
  report_ids: []
  conclusion: ETF 映射、shadow prediction 与市场 context 的信号指标各有评估总体. 正向 IC 不等于执行净收益, 当前证据不能跨这些合同形成统一排名.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: feature-engineering-factor-discovery
  project_ids:
  - alphas
  - genetic-factor-auto-3
  title: 因子发现与复验
  question: 搜索得到的因子是否具备独立复验和稳定性证据?
  taxonomy_path: feature-engineering/factor-discovery
  experiment_ids:
  - crypto-alpha-archive
  - genetic-factor-0327
  report_ids: []
  conclusion: 遗传搜索候选需经大样本复验, 小样本最大值不能代表最终因子质量; crypto 历史归档不提供新的有效性证据.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: prediction-evaluation-robustness-top-k-percent
  project_ids:
  - factor-daily
  title: 尾部信号与成本
  question: Top-k 信号在计入成本后是否仍有研究价值?
  taxonomy_path: prediction-evaluation/robustness/top-k-percent
  experiment_ids:
  - factor-daily-topk-0407
  report_ids: []
  conclusion: Preserve the negative result and revisit portfolio construction, turnover, and factor direction before
    expansion.
  caveats:
  - Positive IC does not imply a profitable net Top10 portfolio.
- id: data-tick
  project_ids:
  - ashare-1s
  title: 逐笔与秒级数据覆盖
  question: 秒级数据是否具备可验证的覆盖和可复刻输入?
  taxonomy_path: data/tick
  experiment_ids:
  - ashare-1s-coverage
  report_ids: []
  conclusion: Continue maintaining the data product; explain and close the 2024 gap before formal cross-year experiments.
  caveats:
  - Only four files cover 2024, so the first and last dates do not imply continuous complete coverage.
- id: data-index-weight
  project_ids:
  - get-index-data
  title: 指数权重数据
  question: 指数数据的覆盖和时效性是否满足研究要求?
  taxonomy_path: data/index-weight
  experiment_ids:
  - index-data-evidence
  report_ids: []
  conclusion: Keep the data entry point and publish health conclusions only after metrics are available.
  caveats:
  - Directory or configuration presence does not prove complete current data.
- id: data
  project_ids:
  - get-data
  title: 数据可用性
  question: 研究所需的数据覆盖和更新证据是否完整?
  taxonomy_path: data
  experiment_ids:
  - market-data-evidence
  report_ids: []
  conclusion: Keep the infrastructure entry point and add dates, gaps, and freshness by dataset.
  caveats:
  - Pipeline code does not prove that current data has no gaps.
- id: data-minute-bar
  project_ids:
  - tdx-data-source
  title: 分钟行情质量
  question: 分钟行情采集和端点能力是否支持稳定研究?
  taxonomy_path: data/minute-bar
  experiment_ids:
  - tdx-data-source-v1
  report_ids: []
  conclusion: Continue auditing the transaction pool on a 10-second cadence. Live Predictor remains on direct one-minute
    bars; a single effective bar endpoint is not high availability.
  caveats:
  - Direct bars currently have one effective endpoint and one failure domain.
  - Transaction snapshots have no trade ID or second-level event time; integrity still depends on overlap and bounded
    backfill.
  - The service has no built-in auth or TLS and requires a trusted proxy before external exposure.
- id: infrastructure-snapshot-visualizer2
  project_ids:
  - snapshot-visualizer2
  title: Visualization Evidence Backlog
  question: Create a stable static example and review note for order-book snapshot diagnostics.
  taxonomy_path: null
  experiment_ids:
  - snapshot-visualizer-evidence
  report_ids: []
  conclusion: Keep the interactive-tool entry and later generate a static demonstration from one sanitized sample.
  caveats:
  - Next build files are not research results and cannot be copied directly as a public report.
- id: infrastructure-webpage5
  project_ids:
  - webpage5
  title: Factor Report Output Inventory
  question: Inventory the expression-factor chain from computation through report output.
  taxonomy_path: null
  experiment_ids:
  - webpage5-factor-reports
  report_ids: []
  conclusion: Show platform output scale first; merge batch statistics only after factor-generation cache provenance
    is confirmed.
  caveats:
  - Report count does not establish factor validity; each performance claim still requires report-level review.
- id: infrastructure-ipcheck
  project_ids:
  - ipcheck
  title: Operational Evidence Backlog
  question: Record the latest check, address changes, and notification-delivery outcome.
  taxonomy_path: null
  experiment_ids:
  - ipcheck-evidence
  report_ids: []
  conclusion: Keep the tool entry and publish only sanitized operational-health summaries.
  caveats:
  - Never publish specific IPs, notification targets, or credentials.
- id: model-batch
  project_ids:
  - prediction-nn-1min
  title: Batch 日期构成
  question: 单日期 batch 的可行性和信号质量如何, 能否归因于日期纯度?
  taxonomy_path: model/batch
  experiment_ids:
  - day-pure-batch-1min
  report_ids: []
  conclusion: Retain the sampler as a feasible treatment, but do not attribute uplift to date purity until a same-commit
    mixed-date one-epoch control and additional seeds are run.
  caveats:
  - This is one seed and one split with no matched mixed-date control; historical baseline differences are not causal
    sampler estimates.
  - Signal diagnostics do not establish execution-ready net profitability.
- id: feature-engineering-feature-set-audit
  project_ids:
  - prediction-nn-1min
  title: 特征组贡献
  question: 新增特征族的预测贡献能否通过 matched ablation 归因?
  taxonomy_path: feature-engineering/feature-set-audit
  experiment_ids:
  - multiscale-market-features-1min
  - 0825-feature-audit
  report_ids: []
  conclusion: matched feature-family ablation 保留三个非 market 特征族作为多 seed 候选; full-63 不是单调改进证据. 独立 36D 单臂结果不能用于归因特征贡献.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
- id: data-engineering-data-clean-outlier-cross-session-window
  project_ids:
  - prediction-nn-1min
  title: 跨交易日窗口
  question: 跨 session 窗口如何改变覆盖、身份和有效样本?
  taxonomy_path: data-engineering/data-clean/outlier/cross-session-window
  experiment_ids:
  - crossday-rolling
  report_ids: []
  conclusion: Retain the boundary implementation as a passed pre-training gate, but do not choose an arm or claim
    model quality until matched formal runs exist.
  caveats:
  - There is no full prepared view, formal training, checkpoint selection, test IC, or comparison report.
  - The implementation was untracked at registry capture, so the recorded HEAD alone cannot reproduce the diagnostic.
- id: feature-engineering-market
  project_ids:
  - prediction-nn-1min
  title: 横截面与市场信息
  question: 同一时点的市场信息能否改善个股预测, 并通过执行检验?
  taxonomy_path: feature-engineering/market
  experiment_ids:
  - market-sample
  - 0827-market-cs
  report_ids: []
  conclusion: panel mean/std、CS rank、latent-z 与 Deep Sets 存在各自 matched 合同内的信号增益. 五臂组中 latent-z 信号最高, 但所有完成臂成本后结果显著为负,
    暂不提升到执行.
  caveats:
  - 跨实验数值仅按各自登记口径展示; matched 比较以实验内的明确合同为准.
