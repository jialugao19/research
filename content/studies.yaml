  - id: baseline-1s-0720
    project: prediction-nn
    track: one-second
    subproject: baseline-1s-0720
    title: 秒级 GRU384 基线评估
    status: doing
    maturity: developmental
    updated_at: 2026-08-02
    objective: 秒级数据包含成交、盘口和委托流，信息量与噪声、换手都明显高于分钟级主线，因此不能沿用 1min 的结论。本实验先对 stock1s/v2 的 78 维去重特征完成 fold0 数据审计，再训练 GRU384 与双层 MLP512×512，并把逐样本信号、重要股票池聚合及 10 分钟成本后组合放在同一评价链路中。
    summary: fold0 测试集包含约 794.8 万个有效评价行，test pooled IC 为 0.09842，Rank IC 为 0.09469，说明模型输出与未来收益存在较强横截面相关性。但成本后候选使用了 test 参与选择，且 10 分钟成本后日均收益为 -0.168%、Sharpe 为 -18.27；当前结果只能证明信号链路值得继续研究，不能证明可交易性。
    decision: 保持 1s 独立研究线，修正选择协议并降低换手后再讨论晋升。
    caveats:
      - 成本换手候选使用 test 参与选择，不能作为正式晋升证据。
      - 10m 成本后日均收益和 Sharpe 为负，gross 表现不可单独引用。
    metrics:
      - id: test-pooled-ic
        label: Test pooled IC
        value: 0.0984152803
        format: decimal
        decimals: 5
        context: fold0，7,947,567 rows
      - id: test-rank-ic
        label: Test Rank IC
        value: 0.0946858020
        format: decimal
        decimals: 5
        context: fold0，7,947,567 rows
      - id: net-daily-return
        label: 10m 成本后日均收益
        value: -0.1679929498
        format: percent
        decimals: 3
        context: c60_top05，test-selected
      - id: net-sharpe
        label: 10m 成本后 Sharpe
        value: -18.2703766
        format: number
        decimals: 2
        context: 59 个交易日
      - id: daily-turnover
        label: 日均换手
        value: 7.9912119
        format: number
        decimals: 2
        unit: x
        context: c60_top05
    report_ids: [0730-stock1s-feature-health-v2, 0802-stock1s-gru384-v2]
    evidence_ref: public-report/0802-stock1s-gru384
    featured: true

