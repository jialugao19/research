  - id: reference-baseline-v2
    project: prediction-nn
    track: one-minute
    subproject: reference-baseline
    title: B+VWAP 信号基线
    status: completed
    maturity: signal-only
    updated_at: 2026-07-21
    objective: 旧基线使用 close 收益作为监督目标，但收盘价标签与可执行成交区间并不完全一致。为判断改进究竟来自标签定义还是样本变化，本实验固定 paired_vwap_valid 有效行集合，只把未来收益端点替换为 VWAP，并保留相同行集合上的 close 标签作为配对对照。
    summary: 实验在相同数据切分和训练协议下分别训练 VWAP 与 close 版本，并用三个随机种子复核差值。seed13 的 VWAP test IC 为 0.07445，close control 为 0.06051，差值为 0.01395；其余两个 seed 的配对差值也为正。信号改善成立，但 10 分钟成本后年化收益仍为负，因此结果只支持更新信号基线。
    decision: 晋升为当前信号基线，但不晋升为 execution-ready 组合基线。
    caveats:
      - 缺少原生 inference_test manifest，当前执行与成本门槛未通过。
      - 10m 成本后年化收益为负，不能用 gross 结果替代。
    metrics:
      - id: vwap-test-ic
        label: B+VWAP test IC
        value: 0.0744533729
        format: decimal
        decimals: 4
        context: seed13，paired_vwap_valid
      - id: close-control-ic
        label: Paired close IC
        value: 0.0605061430
        format: decimal
        decimals: 4
        context: seed13，同一行集合
      - id: ic-delta
        label: Paired IC delta
        value: 0.0139472299
        format: decimal
        decimals: 4
        context: VWAP minus close
      - id: net-annual-return
        label: 10m 成本后年化
        value: -99.48
        format: percent
        decimals: 2
        context: portfolio gate，seed13
    report_ids: []
    evidence_ref: exp-nn/0-select&report/experiments/reference-baseline-v2/results.yaml
    featured: true

  - id: optimize-1min-model
    project: prediction-nn
    track: one-minute
    subproject: optimize-1min-model
    title: 分钟级模型结构最终评估
    status: completed
    maturity: decision-ready
    updated_at: 2026-07-25
    objective: 旧默认模型使用 GRU384×2 和两层 512 单元 MLP，约有 181 万个参数，但更大的容量没有自动带来更稳定的样本外信号。实验先在统一训练预算下筛选 18 个较小的 GRU/MLP 结构，再固定候选，用 seeds 7、11、13 比较 GRU192×2 的 last-hidden 表示与 attention 表示，确认结构收益不是单个随机种子的偶然结果。
    summary: 三个随机种子的最终评估中，GRU192×2 last-hidden 的 test pooled IC 和 Rank IC 均高于 attention 对照；pooled IC 均值为 0.07895，Rank IC 均值为 0.04651，而 attention 的 test IC 为 0.07066。保留模型有 342,337 个参数，约为旧模型的五分之一，在缩小容量的同时提高了多 seed 信号表现。
    decision: 保留 GRU192×2 MLP[] last-hidden；不晋升 attention 或 TCN。
    caveats:
      - 该结论是结构与信号选择，不是成本后交易证明。
    metrics:
      - id: test-pooled-ic
        label: Test pooled IC mean
        value: 0.0789459452
        format: decimal
        decimals: 5
        context: seeds 7/11/13
      - id: test-rank-ic
        label: Test Rank IC mean
        value: 0.0465149687
        format: decimal
        decimals: 5
        context: seeds 7/11/13
      - id: attention-test-ic
        label: Attention test IC
        value: 0.0706621299
        format: decimal
        decimals: 5
        context: 三 seed 对照
      - id: parameters
        label: Trainable parameters
        value: 342337
        format: integer
        context: retained last-hidden model
    report_ids: [0725-1min-model-screening-v2]
    evidence_ref: exp-nn/0-select&report/experiments/optimize-1min-model/results.yaml
    featured: true

