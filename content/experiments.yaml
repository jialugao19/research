experiments:
  - id: us-route-top3-backtest-20261022
    experiment_type: backtest
    model: not-recorded
    project: route
    taxonomy_path: strategy/execution
    related_taxonomy_paths: [strategy/position, strategy/signal]
    title: US Route Top 3 Gross Backtest
    status: completed
    maturity: diagnostic
    updated_at: 2026-10-22
    method: 30-session trend score, next-open execution, and rank-ordered notional inheritance
    dataset: Alpaca SIP adjusted daily OHLC, 52 current symbols, 2016-02-17 through 2026-10-21 held sessions
    decision_state: observe
    primary_metric: gross-cagr
    objective: Evaluate the existing Route trend score as a dynamically eligible US Core Top 3 portfolio against aligned SPY and QQQ buy-and-hold benchmarks.
    summary: Gross CAGR is 40.99% versus 15.74% for SPY and 21.17% for QQQ. Max drawdown is -52.10%, and the peak single-stock weight is 77.34%. The result remains a current-universe historical research simulation.
    decision: Preserve as diagnostic Gross evidence; the source does not establish net performance, unbiased out-of-sample behavior, or deployment readiness.
    caveats:
      - Current symbol selection projected into history creates survivorship and selection bias.
      - Gross ignores commission, spread, slippage, taxes, and capacity; adjusted daily open is an execution proxy.
      - Unchanged Top 3 sets never rebalance, so retained positions drift; MSFT ends at 69.78% weight.
      - Corporate-action-adjusted units are a return proxy, not historical actual share counts or a dividend cash ledger.
    metrics:
      - {id: gross-cagr, label: Gross CAGR, value: 40.99, format: percent, decimals: 2, context: 2016-02-17 open to 2026-10-21 close; calendar-day annualization}
      - {id: max-drawdown, label: Max drawdown, value: -52.10, format: percent, decimals: 2, context: close NAV with initial entry-open peak}
      - {id: sharpe, label: Sharpe, value: 1.08, format: decimal, decimals: 2, context: rf=0; 252 sessions/year; sample standard deviation}
      - {id: spy-cagr, label: SPY CAGR, value: 15.74, format: percent, decimals: 2, context: identical entry open and close valuation dates}
      - {id: qqq-cagr, label: QQQ CAGR, value: 21.17, format: percent, decimals: 2, context: identical entry open and close valuation dates}
      - {id: peak-weight, label: Peak single-name weight, value: 77.34, format: percent, decimals: 2, context: AAPL; 2026-07-28 close}
      - {id: replacements, label: Position replacements, value: 942, format: integer, context: 1887 buy/sell orders; 901 trading days including initial entry}
      - {id: held-sessions, label: Held sessions, value: 2686, format: integer, context: excludes 30-session score warmup}
    report_ids: [1022-us-route-top3-backtest]
    evidence_ref: route/report/us-route-2026-10-21-20261022T070410106228Z-185d062d016f.html
    featured: false

    figures:
    - report_id: 1022-us-route-top3-backtest
      asset: images/equity.png
      title: 'Growth of $100: Top 3, SPY and QQQ'
    - report_id: 1022-us-route-top3-backtest
      asset: images/drawdown.png
      title: Close NAV drawdown

  - id: top1-membership-cost-20261101
    experiment_type: evaluation
    model: GRU
    project: prediction-nn-1min
    taxonomy_path: strategy/execution
    related_taxonomy_paths: [strategy/position, prediction-evaluation/summary/ic]
    title: Fixed-baseline Top 1% A-share Cost Diagnostic
    status: completed
    maturity: diagnostic
    updated_at: 2026-11-01
    method: Minute Top 1% membership, next-minute volume-gated Close, cash constraints, and four slippage scenarios
    dataset: Fixed step_105343 baseline predictions; 205 Test trading days in 2024
    decision_state: diagnostic
    primary_metric: terminal-nav-0bps
    objective: Measure transaction-cost and no-trade sensitivity of a fixed 1min prediction signal without retraining the model.
    summary: At 1 bp commission without the 5 CNY minimum, the 0 bps slippage scenario ends at NAV 5.821406, while 5 bps ends at 0.776490. Eleven 0 bps holdings have no terminal-day trade and are marked to their last traded adjusted prices.
    decision: Keep as a cost sensitivity diagnostic; T+1, board lots, price limits, and executable fills remain untested.
    caveats:
      - The 0 bps slippage scenario still pays commission, transfer fee, and sell-side stamp tax.
      - Last-traded marks on terminal no-trade holdings may exceed recoverable value.
      - Previous Top 10% and 10min portfolios are Gross controls under a different portfolio contract.
    metrics:
      - {id: terminal-nav-0bps, label: Terminal NAV at 0 bps slippage, value: 5.821406, format: decimal, decimals: 3, context: normalized initial capital 1; paid assumed fees; 205 Test days}
      - {id: terminal-nav-5bps, label: Terminal NAV at 5 bps slippage, value: 0.776490, format: decimal, decimals: 3, context: same signal and fee assumptions; single-side slippage}
      - {id: total-cost-0bps, label: Cumulative cost at 0 bps, value: 9.713002, format: decimal, decimals: 3, context: initial-capital units; cumulative over all trades}
      - {id: terminal-stale-holdings, label: Terminal no-trade holdings, value: 11, format: integer, context: 0 bps scenario; last-traded adjusted marks}
      - {id: terminal-stale-nav-share, label: No-trade mark as share of NAV, value: 3.5481, format: percent, decimals: 2, context: 0 bps scenario; recoverability unverified}
      - {id: blocked-exit-stock-days, label: Blocked exit stock-days, value: 47764, format: integer, context: 0 bps scenario; each stock counted once per date}
    report_ids: [1101-top1-membership-cost]
    evidence_ref: exp-repo/exps/top1-membership-cost/runs/top1-membership-cost-20261101-r3/result.yaml
    featured: false
    figures:
    - report_id: 1101-top1-membership-cost
      asset: images/01-cost-nav.png
      title: Top 1% cost scenarios and benchmark NAV

