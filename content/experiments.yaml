  - id: baseline-1s-0720
    experiment_type: evaluation
    model: GRU
    project: prediction-nn-1s
    taxonomy_path: prediction-evaluation/model-comparison
    title: 1s GRU384 Baseline Evaluation
    status: doing
    maturity: developmental
    updated_at: 2026-08-08
    method: GRU384 + MLP512×512
    dataset: stock1s/v2 fold0
    decision_state: iterate
    primary_metric: test-pooled-ic
    objective: Second-level trades, quotes, and order flow carry more information, noise, and turnover than the minute-level mainline. The experiment audits 78 deduplicated stock1s/v2 features on fold0, trains GRU384 with a two-layer MLP512×512 head, and evaluates sample-level signals, key-universe aggregation, and 10-minute net portfolios in one chain.
    summary: Fold0 contains 7,947,567 valid evaluation rows. Test pooled IC is 0.09842 and Rank IC is 0.09469, but the net candidate used test during selection. Its 10-minute net daily return is -0.168% and Sharpe is -18.27. The signal chain merits continued research, but tradability is not established.
    decision: Keep 1s as an independent research line; correct selection policy and reduce turnover before promotion.
    caveats:
      - The cost and turnover candidate used test during selection and cannot support formal promotion.
      - Ten-minute net daily return and Sharpe are negative; gross performance cannot be cited in isolation.
