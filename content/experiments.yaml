  - id: val-select
    experiment_type: validation
    model: not-recorded
    project: prediction-nn-1min
    taxonomy_path: prediction-evaluation/robustness/checkpoint
    title: Robust Checkpoint Selection Rule
    status: completed
    maturity: decision-ready
    updated_at: 2026-06-29
    method: Robust checkpoint selector
    dataset: stock1m rolling / purged folds
    decision_state: retain
    primary_metric: selected-checkpoint
    objective: A single-window validation argmax can follow short-term noise and create hidden overfitting after repeated test inspection. This experiment scores checkpoints across three rolling/purged folds and the final 20 trading days using mean IC minus 0.5 standard deviations, then selects the earlier of the top two.
    summary: The rule selects 20k without reading test ranking and keeps 30k as an aggressive control. In a one-time test audit, the 20k checkpoint has zero regret versus the post-hoc optimum. This supports freezing the selector, not iterating it on the same test set.
    decision: Use 20k as the robust default; retain 30k only as an aggressive comparison.
    caveats:
      - The same test audit must not be reused to tune the selector.
    metrics:
      - id: selected-checkpoint
        label: Robust checkpoint
        value: 20000
        format: integer
        context: earliest top-2
      - id: mean-test-ic
        label: Mean test IC
        value: 0.059220
        format: decimal
        decimals: 5
        context: robust 20k winner
      - id: top-decile-return
        label: Mean top-decile return
        value: 5.235391
        format: bps
        decimals: 2
        context: robust 20k winner
    report_ids: []
    evidence_ref: exp-nn/0-select&report/experiments/val-select/results.yaml
    featured: true

