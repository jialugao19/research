  - id: reference-baseline-v2
    experiment_type: ablation
    model: GRU
    project: prediction-nn-1min
    taxonomy_path: model/baseline
    title: B+VWAP Signal Baseline
    status: completed
    maturity: signal-only
    updated_at: 2026-11-03
    method: Paired VWAP endpoint comparison
    dataset: stock1m paired_vwap_valid
    decision_state: promote
    primary_metric: vwap-test-ic
    objective: The old baseline used close returns even though close labels do not fully align with an executable
      interval. This experiment fixes the paired_vwap_valid rows, changes only the future-return endpoint to VWAP,
      and retains close labels on the same rows as a paired control.
    summary: 相同 paired_vwap_valid 样本上 VWAP 相对 close 的三个 paired seed IC 增量均为正. seed13 为 0.0744533729 vs 0.0605061430.
      成本后结果仍负.
    decision: Promote B+VWAP as the current signal baseline, but not as an execution-ready portfolio baseline.
    caveats:
    - '历史结果: 历史成功. Artifact可得性不改变历史成功/失败, lifecycle和comparison限制单独解释.'
    - A native inference_test manifest is missing, and execution and cost gates have not passed.
    - Ten-minute net annual return is negative; gross results cannot substitute for it.
    metrics:
    - id: vwap-test-ic
      label: B+VWAP test IC
      value: 0.0744533729
      format: decimal
      decimals: 4
      context: seed13, paired_vwap_valid
    - id: close-control-ic
      label: Paired close IC
      value: 0.060506143
      format: decimal
      decimals: 4
      context: seed13, identical row set
    - id: ic-delta
      label: Paired IC delta
      value: 0.0139472299
      format: decimal
      decimals: 4
      context: VWAP minus close
    - id: net-annual-return
      label: 10m net annual return
      value: -99.48
      format: percent
      decimals: 2
      context: portfolio gate, seed13
    report_ids:
    - 1103-reference-baseline-v2-full-071714
    - 1103-reference-baseline-v2-bvwap-comparison-0717
    - 1103-nn-registry-summary
    evidence_ref: exp-nn/0-select&report/experiments/reference-baseline-v2/results.yaml
    featured: true

  - id: optimize-1min-model
    experiment_type: model-screen
    model: GRU / MLP / TCN
    project: prediction-nn-1min
    taxonomy_path: model/baseline
    title: Final 1min Architecture Evaluation
    status: completed
    maturity: decision-ready
    updated_at: 2026-11-03
    method: GRU / MLP architecture screen
    dataset: stock1m · seeds 7/11/13
    decision_state: retain
    primary_metric: test-pooled-ic
    objective: The former default used GRU384×2 with two 512-unit MLP layers and roughly 1.81 million parameters,
      yet capacity did not improve out-of-sample stability. Eighteen smaller GRU/MLP candidates were screened under
      one budget, then GRU192×2 last-hidden and attention representations were compared across seeds 7, 11, and 13.
    summary: GRU192×2 last-hidden 在 seeds 7/11/13 的 IC 和 RankIC 均优于 attention, 平均 test IC 为 0.0789459. TCN 的 seed7
      gate 未通过.
    decision: Retain GRU192×2 MLP[] last-hidden; do not promote attention or TCN.
    caveats:
    - '历史结果: 历史成功. Artifact可得性不改变历史成功/失败, lifecycle和comparison限制单独解释.'
    - This is architecture and signal-selection evidence, not proof of net trading performance.
    metrics:
    - id: test-pooled-ic
      label: Test pooled IC mean
      value: 0.0789459452
      format: decimal
      decimals: 5
      context: seeds 7/11/13
