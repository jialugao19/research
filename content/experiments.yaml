  - id: reference-baseline-v2
    experiment_type: ablation
    model: GRU
    project: prediction-nn-1min
    taxonomy_path: model/baseline
    title: B+VWAP Signal Baseline
    status: completed
    maturity: signal-only
    updated_at: 2026-07-21
    method: Paired VWAP endpoint comparison
    dataset: stock1m paired_vwap_valid
    decision_state: promote
    primary_metric: vwap-test-ic
    objective: The old baseline used close returns even though close labels do not fully align with an executable interval. This experiment fixes the paired_vwap_valid rows, changes only the future-return endpoint to VWAP, and retains close labels on the same rows as a paired control.
    summary: VWAP and close variants use identical splits and training protocols across three seeds. For seed13, VWAP test IC is 0.07445 versus 0.06051 for close, a 0.01395 gain; the other paired seed deltas are also positive. Signal quality improves, but 10-minute net annual return remains negative.
    decision: Promote B+VWAP as the current signal baseline, but not as an execution-ready portfolio baseline.
    caveats:
      - A native inference_test manifest is missing, and execution and cost gates have not passed.
      - Ten-minute net annual return is negative; gross results cannot substitute for it.
    metrics:
      - id: vwap-test-ic
        label: B+VWAP test IC
        value: 0.0744533729
        format: decimal
        decimals: 4
        context: seed13, paired_vwap_valid
      - id: close-control-ic
        label: Paired close IC
        value: 0.0605061430
        format: decimal
        decimals: 4
        context: seed13, identical row set
      - id: ic-delta
        label: Paired IC delta
        value: 0.0139472299
        format: decimal
        decimals: 4
        context: VWAP minus close
      - id: net-annual-return
        label: 10m net annual return
        value: -99.48
        format: percent
        decimals: 2
        context: portfolio gate, seed13
    report_ids: []
    evidence_ref: exp-nn/0-select&report/experiments/reference-baseline-v2/results.yaml
    featured: true

  - id: optimize-1min-model
    experiment_type: model-screen
    model: GRU / MLP / TCN
    project: prediction-nn-1min
    taxonomy_path: model/baseline
    title: Final 1min Architecture Evaluation
    status: completed
    maturity: decision-ready
    updated_at: 2026-07-25
    method: GRU / MLP architecture screen
    dataset: stock1m · seeds 7/11/13
    decision_state: retain
    primary_metric: test-pooled-ic
    objective: The former default used GRU384×2 with two 512-unit MLP layers and roughly 1.81 million parameters, yet capacity did not improve out-of-sample stability. Eighteen smaller GRU/MLP candidates were screened under one budget, then GRU192×2 last-hidden and attention representations were compared across seeds 7, 11, and 13.
    summary: GRU192×2 last-hidden beats attention on both test pooled IC and Rank IC across all three seeds. Mean pooled IC is 0.07895 and mean Rank IC is 0.04651 versus 0.07066 test IC for attention. The retained model has 342,337 parameters, about one fifth of the old model.
    decision: Retain GRU192×2 MLP[] last-hidden; do not promote attention or TCN.
    caveats:
      - This is architecture and signal-selection evidence, not proof of net trading performance.
    metrics:
      - id: test-pooled-ic
        label: Test pooled IC mean
        value: 0.0789459452
        format: decimal
        decimals: 5
        context: seeds 7/11/13
      - id: test-rank-ic
        label: Test Rank IC mean
        value: 0.0465149687
        format: decimal
        decimals: 5
        context: seeds 7/11/13
      - id: attention-test-ic
        label: Attention test IC
        value: 0.0706621299
        format: decimal
        decimals: 5
        context: three-seed control
      - id: parameters
        label: Trainable parameters
        value: 342337
        format: integer
        context: retained last-hidden model
      - id: baseline-parameters
        label: Previous baseline parameters
        value: 1808129
        format: integer
        context: GRU384×2 + MLP512×512
      - id: architecture-candidates
        label: Architectures screened
        value: 18
        format: integer
        context: fixed-budget 1min screen
    report_ids: [0725-1min-model-screening-v2]
    evidence_ref: exp-nn/0-select&report/experiments/optimize-1min-model/results.yaml
