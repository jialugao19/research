      value: 0.0706621299
      format: decimal
      decimals: 5
      context: three-seed control
    - id: parameters
      label: Trainable parameters
      value: 342337
      format: integer
      context: retained last-hidden model
    - id: baseline-parameters
      label: Previous baseline parameters
      value: 1808129
      format: integer
      context: GRU384×2 + MLP512×512
    - id: architecture-candidates
