  - id: genetic-factor-auto-3
    title: Genetic Factor Mining
    category: factor-discovery
    status: maintained
    description: GPU-accelerated genetic search, mutation, and re-evaluation of formula factors in crypto markets, with cross-sample IC and throughput evidence.
    objective: Search crypto factors at high throughput and suppress small-sample selection bias through longer-horizon re-evaluation.
    review_summary: Thirty generations achieved high throughput, but the best small-sample IC fell materially in the 250-day review. Cross-sample decay is a primary result.
    source_refs: [genetic-factor-auto-3]
    stages:
      - {id: data, state: documented, summary: Crypto market samples support short search windows and a longer 250-day review window.}
      - {id: data-engineering, state: in-progress, summary: Cross-sample separation is explicit, while broader data-quality evidence remains limited.}
      - {id: feature-engineering, state: documented, summary: GPU-accelerated genetic search, mutation, and formula re-evaluation define the factor discovery process.}
      - {id: model, state: not-applicable, summary: The project searches symbolic factors rather than training a standalone predictive model.}
      - {id: prediction-evaluation, state: documented, summary: Small-sample IC decay in the longer review is retained as a primary negative result.}
      - {id: strategy, state: gap, summary: No cost-aware portfolio result currently supports promotion.}
  - id: factor-daily
    title: Daily Factor Research
    category: factor-discovery
    status: maintained
    description: Daily price-volume factor research and batch evaluation covering formulas, Rank IC, grouped returns, and backtest evidence.
    objective: Standardize coverage, IC, grouped returns, turnover, and net backtest evaluation for daily factors.
    review_summary: All eight factors in the latest Top10 summary have negative net returns. The evidence is retained as a negative result pending a review of portfolio construction and turnover.
    source_refs: [factor-daily]
    stages:
      - {id: data, state: documented, summary: Daily price-volume inputs define the current factor research frequency and coverage.}
      - {id: data-engineering, state: in-progress, summary: Coverage and batch evaluation are standardized, while point-in-time audits remain ongoing.}
      - {id: feature-engineering, state: documented, summary: Formula factors are generated and retained with explicit expression identities.}
      - {id: model, state: not-applicable, summary: The current evidence evaluates formula factors without a separate forecasting architecture.}
      - {id: prediction-evaluation, state: documented, summary: Rank IC and grouped-return evidence is reported for the latest factor set.}
      - {id: strategy, state: documented, summary: All eight latest Top10 factors have negative net returns after portfolio construction and turnover.}
  - id: feature-analysis
    title: Feature Analysis
    category: factor-discovery
    status: active
    description: Reproducible single-factor analysis across intraday IC, grouped returns, daily portfolios, regime buckets, and implementation semantics.
    objective: Audit each factor from executable formula through out-of-sample behavior before it enters a model or strategy candidate set.
    review_summary: The Alpha001 reproduction covers 28.25 million valid 2024 out-of-sample stock-time rows with 99.27% joint coverage. Its primary-horizon Rank IC is near zero, grouped returns are not stably monotonic, and regime signs change; the factor is not promoted.
    source_refs: [feature-analysis-v2]
    stages:
      - {id: data, state: documented, summary: The current report separates a 2023 development period from a 2024 out-of-sample period and records joint factor-label coverage.}
      - {id: data-engineering, state: documented, summary: Point-in-time inputs, warm-up, label alignment, deterministic ties, and missing-return boundaries are explicit.}
      - {id: feature-engineering, state: documented, summary: Alpha001 is reproduced from the repository's executable operators and audited against conflicting wrapper comments.}
      - {id: model, state: not-applicable, summary: The current work evaluates a fixed formula factor without fitting a forecasting model.}
      - {id: prediction-evaluation, state: documented, summary: IC, Rank IC, grouped returns, daily portfolios, and regime buckets show weak and unstable out-of-sample evidence.}
      - {id: strategy, state: gap, summary: The research portfolios omit costs, trade constraints, and borrow availability and do not establish tradability.}
  - id: return-distribution
    title: A-share Return Distribution
    category: factor-discovery
    status: maintained
    description: Point-in-time analysis of A-share return distributions, calendar effects, style spreads, index membership, industries, and frozen mechanism hypotheses.
    objective: Separate robust cross-sectional and calendar regularities from unstable descriptive patterns under explicit multiple-testing and point-in-time controls.
    review_summary: A self-contained report through 2026-08-11 includes 12 figures, distribution and robustness tables, Fama-MacBeth controls, bootstrap intervals, and Holm-adjusted hypothesis tests. Its findings have not yet been registered as individual public studies.
    source_refs: [return-distribution]
    stages:
      - {id: data, state: documented, summary: Shanghai and Shenzhen A-share returns are joined to point-in-time index, industry, capitalization, and style states.}
      - {id: data-engineering, state: documented, summary: Effective dates, historical membership, fixed labels, and report manifests define the reproducibility boundary.}
      - {id: feature-engineering, state: documented, summary: Calendar, capitalization, volatility, liquidity, and prior-return groupings support mechanism analysis.}
      - {id: model, state: not-applicable, summary: The project estimates distributions and cross-sectional controls rather than a forecasting model.}
      - {id: prediction-evaluation, state: documented, summary: Robustness tables, bootstrap intervals, Fama-MacBeth coefficients, and multiplicity corrections are available.}
      - {id: strategy, state: gap, summary: Descriptive return regularities have not passed a cost-aware portfolio implementation gate.}
  - id: aq2
    title: AQ2 Order Book Reconstruction
    category: market-data
    status: active
    description: Deterministic order-book reconstruction from orders and trades, validated tick by tick against exchange depth snapshots to isolate sequencing, auction, and visible-volume residuals.
    objective: Explain order-book differences without future-truth contamination and maintain a regression-tested exchange-rule state machine.
    review_summary: The v16 three-day full-market sweep completed without processing or book-invariant errors and reduced candidate mismatches. Its candidate boundary uses contemporaneous truth and is not a prediction-accuracy measure.
    source_refs: [AQ2]
    stages:
      - {id: data, state: documented, summary: Orders, trades, and exchange depth snapshots are the point-in-time reconstruction inputs.}
      - {id: data-engineering, state: documented, summary: A deterministic exchange-rule state machine reconstructs the book and checks invariants tick by tick.}
      - {id: feature-engineering, state: not-applicable, summary: The current objective is order-book truth reconstruction rather than predictive feature construction.}
      - {id: model, state: not-applicable, summary: The reconstruction is rule-based and does not train a forecasting model.}
      - {id: prediction-evaluation, state: not-applicable, summary: Candidate mismatches use contemporaneous truth and are not prediction-accuracy evidence.}
      - {id: strategy, state: not-applicable, summary: Trading decisions are outside the reconstruction project boundary.}
