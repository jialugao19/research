schema_version: 1
categories:
  - id: forecasting-models
    title: Forecasting Models
    description: Short-horizon return forecasting, model selection, and live signal evaluation.
  - id: factor-discovery
    title: Factor Discovery
    description: Systematic factor search, validation, and portfolio-level evidence.
  - id: portfolio-execution
    title: Portfolio & Execution
    description: Portfolio construction, execution constraints, and cost-aware strategy research.
  - id: market-data
    title: Market Data
    description: Reproducible market data, order-book reconstruction, and coverage audits.
  - id: research-systems
    title: Research Systems
    description: Visualization, knowledge, and operational systems that support the research lifecycle.
projects:
  - id: prediction-nn-1min
    title: Prediction-NN 1min
    category: forecasting-models
    status: active
    description: Minute-level A-share return forecasting across data contracts, features, models, validation, and execution gates.
    objective: Determine whether information available before prediction time consistently forecasts cross-sectional returns over a future holding period under a reproducible and comparable contract.
    review_summary: >-
      The 1min registry includes date-pure batching, matched feature-family ablations,
      a 10/15/30-minute horizon comparison, a completed 36D feature reference, and two
      market-context studies. B+VWAP is the signal baseline, GRU192×2 last-hidden is the
      compact architecture, and learned panel context leads the latest matched signal
      comparisons; registered cost-aware results remain negative.
    source_refs: [prediction-NN-main, exp-nn]
    stages:
      - id: data
        state: documented
        summary: Samples are keyed by trading day, minute, and security; the main architecture contract uses 60-minute sequences over stock1m inputs.
      - id: data-engineering
        state: documented
        summary: Paired labels, train-only normalization, sample filters, cross-session boundaries, and label horizons are explicit research variables.
      - id: feature-engineering
        state: documented
        summary: Stock1m features are compared through attributable L2 and feature-family ablations, a completed 36D reference, explicit cross-sectional ranks, latent context, and learned panel context.
      - id: model
        state: documented
        summary: Linear and neural baselines lead to the current compact GRU192×2 candidate, with batch construction, loss, capacity, learning-rate, and integration studies kept comparable.
      - id: prediction-evaluation
        state: documented
        summary: Pooled IC, Rank IC, rolling periods, seeds, adjacent checkpoints, and validation-only selectors separate signal evidence from selection bias.
      - id: strategy
        state: gap
        summary: Turnover, costs, slippage, and stable out-of-sample portfolio results have not yet passed an execution gate.
    legacy_topic_redirects:
      - {id: reference-baseline, taxonomy_path: model/baseline}
      - {id: optimize-1min-model, taxonomy_path: model/baseline}
      - {id: loss-function-1min, taxonomy_path: model/loss-function}
      - {id: learning-rate, taxonomy_path: model/optimization}
      - {id: validation, taxonomy_path: prediction-evaluation/robustness/checkpoint}
      - {id: capacity-robust-sampling, taxonomy_path: model/optimization}
      - {id: prediction-calibration, taxonomy_path: data-engineering/label}
      - {id: generalization, taxonomy_path: prediction-evaluation/robustness}
      - {id: limit-pool, taxonomy_path: data-engineering/universe/filters}
      - {id: near-zero-filter, taxonomy_path: data-engineering/data-clean/outlier}
      - {id: zero-aware-normalization, taxonomy_path: data-engineering/data-clean/normalization}
      - {id: l2-features, taxonomy_path: feature-engineering/order-book-l2}
      - {id: feature-cleaning, taxonomy_path: data-engineering/data-clean}
      - {id: integration, taxonomy_path: model/integration}
      - {id: day-pure-batch-1min, taxonomy_path: model/batch}
      - {id: multiscale-market-features-1min, taxonomy_path: feature-engineering/feature-set-audit}
      - {id: market-context-1min, taxonomy_path: feature-engineering/market}
      - {id: feature-audit-1min, taxonomy_path: feature-engineering/feature-set-audit}
      - {id: baseline-1min-0813, taxonomy_path: model/baseline}
      - {id: crossday-rolling, taxonomy_path: data-engineering/data-clean/outlier/cross-session-window}
      - {id: horizon-labels, taxonomy_path: data-engineering/label}

  - id: prediction-nn-1s
    title: Prediction-NN 1s
    category: forecasting-models
    status: active
    description: Second-level A-share forecasting over independent stock1s contracts, order-flow features, neural models, fold evaluation, turnover, and costs.
    objective: Test whether trades, quotes, and order flow add stable forecasting power under an independent data, selection, and cost contract.
    review_summary: >-
      The legacy fold0 result has strong pooled IC and Rank IC, but its portfolio
      candidate used test during selection and remains net-negative. The independent
      OHLCV-only v2 contract yields weak pooled IC and a sharply negative 10 bps
      backtest. Both contracts remain research-only.
    source_refs: [prediction-NN-main, exp-nn]
    stages:
      - id: data
        state: documented
        summary: Stock1s contracts are keyed by trading day, second, and security, with independent train, validation, and test stores.
      - id: data-engineering
        state: documented
        summary: Coverage, missingness, label endpoints, session behavior, and the independent OHLCV-only v2 contract are audited before comparison.
      - id: feature-engineering
        state: documented
        summary: The legacy contract uses 78 deduplicated trade, quote, depth, volatility, intensity, and order-flow features; v2 uses an independent 42-feature OHLCV set.
      - id: model
        state: documented
        summary: The legacy baseline uses GRU384 with a two-layer MLP512×512 head; v2 is evaluated without claiming direct uplift over that contract.
      - id: prediction-evaluation
        state: documented
        summary: Fold metrics, missingness diagnostics, grouped signal quality, selection discipline, and test-use boundaries determine comparability.
      - id: strategy
        state: documented
        summary: Turnover and cost sweeps remain net-negative, and neither contract passes the deployment gate.
    legacy_topic_redirects:
      - {id: baseline-1s-0720, taxonomy_path: prediction-evaluation/model-comparison}
      - {id: baseline-1s-v2, taxonomy_path: prediction-evaluation/model-comparison}
  - id: ashare-cnn
    title: A-share Chart CNN
    category: forecasting-models
    status: active
    description: Cross-sectional five-day A-share return forecasting from compact monochrome candlestick, moving-average, and volume images.
    objective: Test whether a fixed 20-day chart representation contains stable out-of-sample ranking information beyond tabular price-volume baselines.
    review_summary: The project has fixed its image, cache, split, checkpoint, and managed-experiment contracts. No reviewed full-scale result or publishable report is registered yet.
    source_refs: [ashare-cnn]
    stages:
      - {id: data, state: documented, summary: Daily A-share market data and five-day forward cross-sectional labels define the current sample contract.}
      - {id: data-engineering, state: documented, summary: Shared float32 image caches are bound to the data and rendering contract rather than training variants.}
      - {id: feature-engineering, state: documented, summary: Each sample is a fixed 95x60 monochrome chart with 20 candles, a five-day moving average, and volume bars.}
      - {id: model, state: in-progress, summary: Managed ResNet18 trials and resumable checkpoints are implemented, while the formal model comparison is incomplete.}
      - {id: prediction-evaluation, state: gap, summary: No reviewed full-scale out-of-sample result is registered.}
      - {id: strategy, state: gap, summary: Cost, turnover, and execution evidence have not been published.}
  - id: astock-overnight
    title: A-stock Overnight
    category: forecasting-models
    status: active
    description: Full-market A-share overnight cross-sectional ranking from a 13:58 signal to a 14:00 entry and next-session exit contract.
    objective: Determine whether point-in-time minute and daily factors support stable overnight stock ranking under explicit eligibility, delayed-exit, and split rules.
    review_summary: The formal 2025 one-shot test reports 0.11449 all-market daily mean Rank IC and 23.72% gross Q10 return. Costs, price impact, borrow constraints, and a signal-limit filter review remain outside the current promotion evidence.
    source_refs: [astock-overnight]
    stages:
      - {id: data, state: documented, summary: The 2021-2025 minute market, daily references, index weights, and point-in-time security states are audited and versioned.}
      - {id: data-engineering, state: documented, summary: Eligibility, delayed exits, split purging, anomaly handling, and immutable artifact lifecycles are explicit.}
      - {id: feature-engineering, state: documented, summary: Core v1 contains fixed minute-stock, minute-market, daily-stock, and daily-market factor definitions.}
      - {id: model, state: documented, summary: A dual-GRU late-fusion baseline consumes separate minute and daily sequences under a frozen training contract.}
      - {id: prediction-evaluation, state: documented, summary: Validation and one-shot test results include daily Rank IC, deciles, concentration, and CSI1800 reranking.}
      - {id: strategy, state: in-progress, summary: Gross long-only cohorts are reported, but costs, price impact, and execution promotion gates remain open.}
  - id: m3-cn
    title: M3-CN Event Model
    category: forecasting-models
    status: active
    description: A planned A-share state-event foundation model for next-event distributions and autoregressive order-book event rollouts.
    objective: Learn reproducible event dynamics from canonical orders, trades, and L2 state while preserving exchange semantics and replay validity.
    review_summary: The research and data-gate plan is documented, but implementation has not passed the Phase 0 NAS schema, sequence, replay, and licensing audit. No model result is registered.
    source_refs: [m3]
    stages:
      - {id: data, state: in-progress, summary: Historical order, trade, and snapshot archives are identified; schema continuity, licensing, and source semantics remain gated.}
      - {id: data-engineering, state: gap, summary: Canonical events, deterministic LOB replay, manifests, and train-only tokenization statistics are planned but not yet validated.}
      - {id: feature-engineering, state: not-applicable, summary: The intended model learns from normalized events and book state rather than an alpha-factor layer.}
      - {id: model, state: gap, summary: Markov, timing, factorized Transformer, and VQ autoregressive baselines are specified but not yet implemented.}
      - {id: prediction-evaluation, state: gap, summary: Event likelihood, calibration, replay validity, and distribution-fidelity gates are not yet available.}
      - {id: strategy, state: not-applicable, summary: Strategy returns are explicitly outside the first-stage success criteria.}
  - id: index500-predict
    title: Index500 Predict
    category: forecasting-models
    status: active
    description: End-to-end forecasting for CSI 500 constituents and the 510500 ETF, from stock-level alpha and basket aggregation to basis adjustment and 30-minute trading maps.
    objective: Close the loop from constituent signals to tradable ETF mappings and test robustness with rolling validation, costs, and slippage.
    review_summary: ETF forecasts and basket aggregation both show material IC. The piecewise mapping improves on the old direct-short interpretation, but the current report excludes transaction costs and slippage.
    source_refs: [index500-predict, exp-index]
    stages:
      - {id: data, state: documented, summary: Constituent, weight, stock-level signal, ETF, and basis inputs are defined for the CSI 500 workflow.}
      - {id: data-engineering, state: documented, summary: Basket aggregation and time-aligned ETF mapping connect constituent inputs to comparable evaluation rows.}
      - {id: feature-engineering, state: in-progress, summary: Stock-level alpha aggregation and basis adjustment are documented, while broader feature attribution remains open.}
      - {id: model, state: documented, summary: Constituent and ETF forecasting variants are compared under the same end-to-end objective.}
      - {id: prediction-evaluation, state: documented, summary: Six backtests and ETF comparisons show material IC but retain explicit evidence boundaries.}
      - {id: strategy, state: gap, summary: Transaction costs and slippage are absent from the current report, so the trading map is not execution-ready.}
  - id: limit-0729
    title: Limit / T+1
    category: portfolio-execution
    status: active
    description: Rule funnels, walk-forward ranking, fill constraints, and mechanical T+1 exits for first-limit A-share candidates under stressed costs.
    objective: Develop a simulation-ready strategy without temporal leakage, with auditable fills and acceptable stressed costs.
    review_summary: Drawdown and relative gates are acceptable, but the 30bp annual-return gate fails and the frozen test has too few trades. The strategy is not promoted to simulation.
    source_refs: [limit-0729]
    stages:
      - {id: data, state: documented, summary: First-limit A-share candidates and their market paths define the strategy research universe.}
      - {id: data-engineering, state: documented, summary: Rule funnels, temporal controls, fill constraints, and mechanical T+1 exits form the simulation contract.}
      - {id: feature-engineering, state: not-applicable, summary: The current strategy is rule-driven and does not maintain a separate feature-research layer.}
      - {id: model, state: not-applicable, summary: Candidate ranking is evaluated as a strategy rule rather than a standalone forecasting model.}
      - {id: prediction-evaluation, state: documented, summary: Walk-forward ranking and frozen-test evidence expose sample-size and promotion limits.}
      - {id: strategy, state: documented, summary: Cost, drawdown, annual-return, fill, and trade-count gates are evaluated; the strategy is not promoted.}
  - id: route
    title: ETF Route Picker
    category: portfolio-execution
    status: active
    description: A scheduled ETF rotation selector using aligned daily returns, normalized price paths, and a fixed trend-persistence score.
    objective: Maintain an auditable and freshness-gated ETF selection rule with reproducible data, scoring, scheduling, and result artifacts.
    review_summary: The production workflow has explicit calendar, cache, freshness, retry, credential, and scheduling contracts. No reviewed out-of-sample strategy report, cost model, or comparative benchmark is registered.
    source_refs: [route]
    stages:
      - {id: data, state: documented, summary: ProMax fund-daily responses and an exchange calendar are validated against an expected trading date before use.}
      - {id: data-engineering, state: documented, summary: Overlap refresh, persistent cache, cross-ETF date alignment, retries, and freshness gates fail closed.}
      - {id: feature-engineering, state: documented, summary: Daily percentage changes form normalized price paths over a fixed common trading window.}
      - {id: model, state: documented, summary: A deterministic OLS slope times cubed R-squared score selects the current best hold.}
      - {id: prediction-evaluation, state: gap, summary: No reviewed out-of-sample comparison or stability analysis is registered.}
      - {id: strategy, state: gap, summary: Turnover, costs, execution, drawdown, and benchmark evidence are not publicly evaluated.}
  - id: shouban2
    title: First Board Top-K
    category: portfolio-execution
    status: maintained
    description: Continuous scoring, Top-K portfolio constraints, fill realization, and layered backtests for first-board and weak-to-strong candidates.
    objective: Test whether rank stability, portfolio constraints, and realistic fills jointly support a first-board strategy.
    review_summary: A historical MHTML candidate exists, but it depends on local Streamlit resources and has not passed ownership or static-publication gates. No quantitative conclusion is published yet.
    source_refs: [shouban2]
    stages:
      - {id: data, state: in-progress, summary: First-board and weak-to-strong candidates define the intended universe, but no reviewed coverage snapshot is public.}
      - {id: data-engineering, state: in-progress, summary: Fill realization and portfolio constraints are part of the intended contract but lack a published audit.}
      - {id: feature-engineering, state: in-progress, summary: Continuous scoring inputs are registered without decision-ready public attribution.}
      - {id: model, state: in-progress, summary: Ranking logic exists in historical application material but is not a reviewed model baseline.}
      - {id: prediction-evaluation, state: gap, summary: The historical report has not passed ownership or static-publication gates.}
      - {id: strategy, state: gap, summary: No public quantitative conclusion yet supports simulation or promotion.}
