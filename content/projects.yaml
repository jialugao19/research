schema_version: 1
categories:
  - id: forecasting-models
    title: Forecasting Models
    description: Short-horizon return forecasting, model selection, and live signal evaluation.
  - id: factor-discovery
    title: Factor Discovery
    description: Systematic factor search, validation, and portfolio-level evidence.
  - id: portfolio-execution
    title: Portfolio & Execution
    description: Portfolio construction, execution constraints, and cost-aware strategy research.
  - id: market-data
    title: Market Data
    description: Reproducible market data, order-book reconstruction, and coverage audits.
  - id: research-systems
    title: Research Systems
    description: Visualization, knowledge, and operational systems that support the research lifecycle.
projects:
  - id: prediction-nn
    title: Prediction-NN
    category: forecasting-models
    status: active
    description: Neural forecasting research for minute- and second-level A-share returns, with separate evidence for data, models, validation, and trading evaluation.
    objective: Build a reproducible and comparable neural research system that clearly separates signal quality from trading feasibility.
    review_summary: >-
      The 1min registry now includes date-pure batching, matched feature-family ablations,
      and a 10/15/30-minute horizon comparison alongside the established multi-seed
      architecture results. The 1s line has two incompatible contracts: the legacy fold0
      signal is strong but test-selected, while the OHLCV-only v2 run has weak pooled IC
      and a sharply negative 10 bps net backtest. Neither line is execution-ready.
    source_refs: [prediction-NN-main, exp-nn]
    tracks:
      - id: one-minute
        title: 1min Forecasting Research
        description: Research on stock1m labels, architectures, losses, sampling, checkpoint selection, and generalization.
        objective: The minute-level program asks whether information available before prediction time can consistently forecast cross-sectional returns over a future holding period. It fixes data, labels, temporal splits, and checkpoint policy before testing architectures, losses, sample treatment, and feature extensions. Signal correlation, net portfolio performance, and execution feasibility remain separate evidence layers.
        objective_details:
          - 'Comparability: every candidate must use identical sample rows, time splits, training budgets, and selection rules so data-contract changes are not mistaken for model improvements.'
          - 'Robustness: key conclusions require confirmation across seeds, rolling periods, and neighboring checkpoints. A single test maximum is diagnostic evidence, not a default-selection rule.'
          - 'Executability: models must first pass pooled IC and Rank IC signal gates, then separately pass turnover, cost, slippage, and out-of-sample stability checks. An offline signal win does not imply deployability.'
        data_structure:
          - 'Sample index: base data is keyed by trading day, minute, and security. Train, validation, and test segments are split by day to prevent leakage across neighboring timestamps.'
          - 'Model input: sequence models consume batch × time-step × feature tensors. Architecture studies use 60 minute steps and 14 market features; experiments that change either dimension declare it separately.'
          - 'Labels and controls: the current mainline uses future 10-minute VWAP returns, a one-minute entry lag, and the paired_vwap_valid row set, with close-return labels retained on the same rows as a paired control.'
          - 'Evaluation artifacts: each experiment preserves configuration, checkpoints, split predictions, and aggregate metrics. Feature and label normalization is estimated from train only, validation selects candidates, and test is reserved for final audit.'
        conclusion: Current evidence supports B+VWAP as the minute-level signal baseline, GRU192×2 last-hidden as the compact architecture, and the robust 20k checkpoint as the conservative selector. New single-seed evidence shows that date-pure batching is feasible, three non-market feature families improve over legacy14, and 15/30-minute labels alter signal ranking under a matched contract. These additions remain ablations rather than execution evidence, the native v2 baseline refactor has not produced a formal prediction run, and net results still do not justify trading execution.
      - id: one-second
        title: 1s Forecasting Research
        description: Second-level stock1s/v2 features, models, fold evaluation, turnover, and cost research.
        objective: The second-level program tests whether trades, quotes, and order flow add stable forecasting power beyond the minute-level mainline. It uses an independent dataset, feature contract, folds, and cost evaluation. Promotion requires signal quality, selection stability, and net performance to pass together.
        objective_details:
          - 'Data validity: verify second-level files, feature coverage, missingness, and label endpoints before comparing models so gaps and market sessions cannot become spurious signals.'
          - 'Selection discipline: checkpoints, thresholds, and portfolio candidates must be chosen on train/validation. Test is a one-time evaluation set and cannot continue participating in selection.'
          - 'Trading gate: report turnover, net daily return, and Sharpe alongside pooled IC and Rank IC. A high-frequency signal that cannot cover costs is not promoted.'
        data_structure:
          - 'Sample index: stock1s/v2 is keyed by trading day, second, and security, with separate train, validation, and test stores for fold0.'
          - 'Feature vector: the baseline contains 78 deduplicated features spanning short-window return and volatility, trading intensity, spread and depth, quote quality, and order flow, with explicit missingness semantics.'
          - 'Models and labels: GRU384 plus a two-layer MLP512×512 head consumes the second-level sequence. Labels and endpoints follow a dedicated 1s protocol and are not mixed with 1min labels.'
          - 'Evaluation artifacts: sample predictions, grouped signal metrics, key-universe aggregates, turnover, and cost results jointly determine whether an experiment remains comparable.'
        conclusion: The legacy fold0 result has strong pooled IC and Rank IC, but its portfolio candidate used test during selection and remains net-negative. The independent OHLCV-only v2 contract avoids a direct uplift claim and yields only 0.00925 pooled IC; its fixed 10 bps cohort backtest loses 95.14% cumulatively with Sharpe -92.55. The data and signal chain merit further research, but both contracts remain research-only and the v2 checkpoint is explicitly rejected for deployment.
    subprojects:
      - id: reference-baseline
        title: Reference Baseline
        track: one-minute
        group: Baselines & Model Design
        description: Minute-level reference baselines, label endpoints, and the current comparable signal anchor.
        objective: Fix a reproducible baseline and identify the remaining gates between signal and execution baselines.
      - id: optimize-1min-model
        title: 1min Model Architecture
        track: one-minute
        group: Baselines & Model Design
        description: Capacity, stability, and test comparisons across GRU, pooling, MLP, and TCN architectures.
        objective: Select a smaller and more stable minute-level architecture using multi-seed evidence.
      - id: loss-function-1min
        title: 1min Loss Functions
        track: one-minute
        group: Baselines & Model Design
        description: Compare MSE, correlation, moment, and output-scale constrained losses.
        objective: Improve signal IC and prediction scale without treating a single-seed result as a final promotion.
      - id: learning-rate
        title: Learning Rate & Schedulers
        track: one-minute
        group: Baselines & Model Design
        description: Learning-rate, multi-seed stability, and scheduler screening under a fixed training budget.
        objective: Fix a stable optimizer rate and scheduler configuration for subsequent experiments.
      - id: validation
        title: Validation & Checkpoint Selection
        track: one-minute
        group: Validation, Selection & Robustness
        description: Rolling and purged validation, window selection, and robust checkpoint selectors.
        objective: Prevent selection bias from validation argmax and repeated inspection of test results.
      - id: capacity-robust-sampling
        title: Capacity & Robust Sampling
        track: one-minute
        group: Validation, Selection & Robustness
        description: Effects of capacity, dropout, robust losses, and decorrelated sampling on early overfitting.
        objective: Identify mechanisms that reduce late-checkpoint degradation and merit multi-period validation.
      - id: prediction-calibration
        title: Labels & Prediction Calibration
        track: one-minute
        group: Data, Labels & Sampling
        description: Compare close, VWAP, volatility normalization, and impact weights for IC and calibration.
        objective: Reduce label noise on paired rows and evaluate signal gains separately from calibration gates.
      - id: generalization
        title: Generalization & Robustness
        track: one-minute
        group: Validation, Selection & Robustness
        description: Rolling years, endpoint strides, adjacent windows, multiple seeds, and checkpoint-curve diagnostics.
        objective: Test whether conclusions persist across time and seeds while marking diagnostics exposed to test.
      - id: limit-pool
        title: Limit-state Sample Pools
        track: one-minute
        group: Data, Labels & Sampling
        description: Compare all, touch, and limit-state sample pools plus full-test diagnostics.
        objective: Determine whether historical limit-state filtering improves signal quality under the same evaluation contract.
      - id: near-zero-filter
        title: Near-zero Filtering
        track: one-minute
        group: Data, Labels & Sampling
        description: Effects of exact-zero and near-zero return-feature filtering on IC, hit rate, and sample retention.
        objective: Find filtering rules that improve prediction quality without materially distorting the valid sample distribution.
      - id: zero-aware-normalization
        title: Zero-aware Normalization
        track: one-minute
        group: Data, Labels & Sampling
        description: Compare zero indicators, piecewise standardization, hurdle models, and jitter transforms.
        objective: Evaluate representations of structural zeros against an explicit no-transform control.
      - id: l2-features
        title: L2 Features
        track: one-minute
        group: Feature Extensions & Integration
        description: Contribution of L2-derived features such as snapshot fast12 relative to the stock1m baseline.
        objective: Run attributable L2 feature ablations under a consistent checkpoint-candidate policy.
      - id: feature-cleaning
        title: Feature Cleaning
        track: one-minute
        group: Data, Labels & Sampling
        description: Historical feature-cleaning bundles and data-quality research.
        objective: Preserve historical evidence and restore it as a current baseline only when configuration and artifacts are reproducible.
      - id: integration
        title: Integrated Improvements
        track: one-minute
        group: Feature Extensions & Integration
        description: Test touch, near-zero, learning-rate, and other isolated changes in one controlled matrix.
        objective: Determine whether local improvements compose while preserving negative results and rerun requirements.
      - id: baseline-1s-0720
        title: 1s Data Baseline
        track: one-second
        group: 1s Baseline & Execution Gates
        description: stock1s/v2 data, feature health, GRU models, fold evaluation, costs, and turnover.
        objective: Establish an independent second-level baseline and keep it in research status until predeclared selection and net-return gates pass.
      - id: day-pure-batch-1min
        title: Date-pure Batch Sampling
        track: one-minute
        group: Data, Labels & Sampling
        description: One-equivalent-epoch training with every batch restricted to a single trading date.
        objective: Verify date-pure sampler integrity and feasibility before estimating any causal uplift against a matched mixed-date control.
      - id: multiscale-market-features-1min
        title: Multiscale Market Features
        track: one-minute
        group: Feature Extensions & Integration
        description: Corrected-label 63-feature training and matched add-one ablations for market, liquidity, volatility, and trend families.
        objective: Identify which feature families add signal under a frozen row, model, optimizer, and selection contract.
      - id: baseline-1min-0813
        title: Native v2 1min Baseline
        track: one-minute
        group: Baselines & Model Design
        description: Production-chain refactor for the native 63-feature v2 contract with maintained leakage diagnostics.
        objective: Establish an auditable native v2 baseline before making IC or model-quality comparisons.
      - id: crossday-rolling
        title: Cross-session Rolling Features
        track: one-minute
        group: Data, Labels & Sampling
        description: A/B/C boundary semantics for carrying, dropping, or shifting rolling history across valid trading sessions.
        objective: Validate boundary identity, coverage, and distinctness before any matched training comparison.
      - id: horizon-labels
        title: Label Horizon Comparison
        track: one-minute
        group: Data, Labels & Sampling
        description: Matched 10-, 15-, and 30-minute forward-return labels on one common 47-feature test universe.
        objective: Measure how label horizon changes IC, ranking, and spread without changing features, rows, model, seed, or budget.
      - id: baseline-1s-v2
        title: OHLCV-only Stock1s v2
        track: one-second
        group: 1s Baseline & Execution Gates
        description: Independent 42-feature OHLCV-only second-level contract with validation-only early stopping and fixed-cost cohort backtest.
        objective: Test whether the simplified v2 data contract produces a stable and cost-covering signal without reusing the legacy fold0 comparison claim.
  - id: index500-predict
    title: Index500 Predict
    category: forecasting-models
    status: active
    description: End-to-end forecasting for CSI 500 constituents and the 510500 ETF, from stock-level alpha and basket aggregation to basis adjustment and 30-minute trading maps.
    objective: Close the loop from constituent signals to tradable ETF mappings and test robustness with rolling validation, costs, and slippage.
    review_summary: ETF forecasts and basket aggregation both show material IC. The piecewise mapping improves on the old direct-short interpretation, but the current report excludes transaction costs and slippage.
    source_refs: [index500-predict, exp-index]
  - id: limit-0729
    title: Limit / T+1
    category: portfolio-execution
    status: active
    description: Rule funnels, walk-forward ranking, fill constraints, and mechanical T+1 exits for first-limit A-share candidates under stressed costs.
    objective: Develop a simulation-ready strategy without temporal leakage, with auditable fills and acceptable stressed costs.
    review_summary: Drawdown and relative gates are acceptable, but the 30bp annual-return gate fails and the frozen test has too few trades. The strategy is not promoted to simulation.
    source_refs: [limit-0729]
  - id: shouban2
    title: First Board Top-K
    category: portfolio-execution
    status: maintained
    description: Continuous scoring, Top-K portfolio constraints, fill realization, and layered backtests for first-board and weak-to-strong candidates.
    objective: Test whether rank stability, portfolio constraints, and realistic fills jointly support a first-board strategy.
    review_summary: A historical MHTML candidate exists, but it depends on local Streamlit resources and has not passed ownership or static-publication gates. No quantitative conclusion is published yet.
    source_refs: [shouban2]
  - id: alphas
    title: Crypto Alphas
    category: factor-discovery
    status: archived
    description: Minute-level crypto price-volume factors for timing, cross-sectional prediction, and robustness; maintained as a historical research archive.
    objective: Preserve the crypto-alpha research lineage and restore key results only when the evidence contract is auditable.
    review_summary: No reviewed static report or quantitative snapshot is available. The page preserves project intent and archive status only.
    source_refs: [alphas]
  - id: genetic-factor-auto-3
    title: Genetic Factor Mining
    category: factor-discovery
    status: maintained
    description: GPU-accelerated genetic search, mutation, and re-evaluation of formula factors in crypto markets, with cross-sample IC and throughput evidence.
    objective: Search crypto factors at high throughput and suppress small-sample selection bias through longer-horizon re-evaluation.
    review_summary: Thirty generations achieved high throughput, but the best small-sample IC fell materially in the 250-day review. Cross-sample decay is a primary result.
    source_refs: [genetic-factor-auto-3]
  - id: factor-daily
    title: Daily Factor Research
    category: factor-discovery
    status: maintained
    description: Daily price-volume factor research and batch evaluation covering formulas, Rank IC, grouped returns, and backtest evidence.
    objective: Standardize coverage, IC, grouped returns, turnover, and net backtest evaluation for daily factors.
    review_summary: All eight factors in the latest Top10 summary have negative net returns. The evidence is retained as a negative result pending a review of portfolio construction and turnover.
    source_refs: [factor-daily]
  - id: aq2
    title: AQ2 Order Book Reconstruction
    category: market-data
    status: active
    description: Deterministic order-book reconstruction from orders and trades, validated tick by tick against exchange depth snapshots to isolate sequencing, auction, and visible-volume residuals.
    objective: Explain order-book differences without future-truth contamination and maintain a regression-tested exchange-rule state machine.
    review_summary: The v16 three-day full-market sweep completed without processing or book-invariant errors and reduced candidate mismatches. Its candidate boundary uses contemporaneous truth and is not a prediction-accuracy measure.
    source_refs: [AQ2]
  - id: ashare-1s
    title: A-share 1s
    category: market-data
    status: active
    description: Versioned stock1s/v2 data built from A-share L2 orders, trades, and snapshots, with daily coverage manifests and quality audits.
    objective: Produce a reproducible and auditable second-level dataset that 1s models can consume independently.
    review_summary: The catalog contains 960 daily coverage files and 956 audits. Only four files cover 2024, a material gap that must be resolved.
    source_refs: [ashare-1s]
  - id: get-index-data
    title: Index Data Loader
    category: market-data
    status: maintained
    description: Reproducible index constituents, weights, and ETF mappings for index research.
    objective: Maintain stable constituent, weight, versioning, and storage contracts for index workflows.
    review_summary: No independent quantitative report is registered. The project page records its data responsibility pending coverage and freshness audits.
    source_refs: [get-index-data]
  - id: get-data
    title: Market Data Pipeline
    category: market-data
    status: maintained
    description: Acquisition, update, and storage pipelines for daily, minute, calendar, and market-mirror data.
    objective: Provide stable, inspectable, and incrementally updateable market data infrastructure.
    review_summary: No unified coverage snapshot is registered. Dataset ranges, gaps, and latest successful updates remain evidence backlog items.
    source_refs: [get_data]
  - id: tdx-data-source
    title: TDX Data Source
    category: market-data
    status: active
    description: A clean-room Go market-data source for A-share discovery, direct one-minute bars, capability-aware live transactions, 2-of-3 historical quorum, and an independent ExHQ IF/IC/IM futures service.
    objective: Expose explicit capability, connection, reconnection, concurrency, integrity, and consistency controls for TDX equities and index futures.
    review_summary: On 08-05, three independent transaction endpoints completed repeated 1,800-symbol sweeps with 1,800 nonempty responses, zero failures, and 1.289s p95. Direct bars still have one effective endpoint and remain a single failure domain.
    source_refs: [tdx-data-source]
  - id: snapshot-visualizer2
    title: Snapshot Visualizer
    category: research-systems
    status: maintained
    description: Interactive order-book snapshots, spreads, depth, imbalance, and time evolution for L2 diagnostics.
    objective: Reduce manual investigation cost for book and snapshot anomalies through reproducible visual inspection.
    review_summary: Application artifacts exist, but no reviewed static research report is available. The page records functional boundaries and missing evidence.
    source_refs: [snapshot-visualizer2]
  - id: webpage5
    title: Factor Research Platform
    category: research-systems
    status: active
    description: Expression-driven factor generation, batch evaluation, backtesting, artifact management, and web presentation.
    objective: Connect factor generation, evaluation, comparison, and presentation through one expression and artifact contract.
    review_summary: Seven factor-evaluation reports exist in the project. Cached batch results require provenance confirmation before entering public statistics.
    source_refs: [webpage5]
  - id: live-predictor
    title: Live Predictor
    category: forecasting-models
    status: active
    description: A live evaluation loop that consumes TDX one-minute data, runs frozen Prediction-NN models, aggregates three ETF constituent baskets, and records causal realized returns and service quality.
    objective: Build an auditable loop from live data gates and inference through persistence and shadow evaluation, remaining non-actionable until evidence is sufficient.
    review_summary: On the morning of 08-05, all 1,800 securities passed data gates and produced 156 matured predictions. Aggregate direction accuracy was 48.98%, and historical extreme-tail behavior is inconsistent. The system remains research monitoring only.
    source_refs: [live-predictor]
  - id: deep-ml
    title: Deep-ML Knowledge Base
    category: research-systems
    section: knowledge
    status: active
    description: A knowledge-engineering system that organizes machine learning into a concept graph, original Chinese learning units, course paths, and quality checks.
    objective: Maintain a publishable and verifiable machine-learning knowledge package isolated from temporary discovery sources.
    review_summary: The publishable snapshot contains 735 concepts, 653 original Chinese articles, 2,585 relations, and 18 learning paths. All articles pass automated editorial checks; this is not a human or factual certification.
    source_refs: [deep-ml]
  - id: quant-knowledge
    title: Quant Knowledge
    category: research-systems
    section: knowledge
    status: active
    description: A chapter-based practical knowledge project covering Python, statistics, time series, machine learning practice, market microstructure, and computer-science foundations.
    objective: Publish the original knowledge booklet as an independent source inside the unified Knowledge section without merging it into the DeepML concept graph.
    review_summary: The publishable snapshot contains 136 Chinese chapters across eight sections. Deep learning is an independent five-part section; chapters remain distinct from DeepML concepts and learning paths.
    source_refs: [knowledge]
  - id: ipcheck
    title: IP Check
    category: research-systems
    status: maintained
    description: Detects internal and external IP changes and sends change-triggered notifications to maintain research-service reachability.
    objective: Reduce address-change outages through one-shot, auditable operational checks.
    review_summary: No research-performance metric is registered. Future evidence may include the latest check time and notification success rate.
    source_refs: [ipcheck]
